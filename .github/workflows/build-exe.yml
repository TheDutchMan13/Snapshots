name: Build Windows exe

# Builds Snapshots.exe and its installer (Snapshots-Setup.exe) on a Windows machine at GitHub.
#   - Push a tag like v0.7.0 to publish the exe on the repository's Releases page.
#   - Or open the Actions tab, pick this workflow and press "Run workflow";
#     the exe is then attached to the run as a download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # lets the last step attach the exe to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt pyinstaller

      - name: Tests
        run: python -m pytest -q --reruns 2 --reruns-delay 2   # a slow runner can make a timing-dependent test fail once

      - name: Build exe
        run: pyinstaller --noconfirm --clean snapshots.spec

      - name: Smoke test the built exe (server only)
        shell: pwsh
        run: |
          # Start the real exe on a tiny library and check it works end to end.
          $lib  = Join-Path $env:RUNNER_TEMP 'smoke-lib'
          $data = Join-Path $env:RUNNER_TEMP 'smoke-data'
          $conf = Join-Path $env:RUNNER_TEMP 'smoke.toml'
          New-Item -ItemType Directory -Force $lib | Out-Null
          python -c "from PIL import Image; Image.new('RGB', (64, 64), (10, 120, 160)).save(r'$lib\a.jpg')"
          # A camera RAW file (a small DNG): thumbnails for RAW files come from LibRaw, a native library in the exe.
          python -c "import sys; sys.path[:0] = ['.', 'tests']; from helpers import make_dng; from pathlib import Path; make_dng(Path(r'$lib\camera.dng'))"
          # No downloads in the smoke test: faces and places are checked by the Python tests.
          [IO.File]::WriteAllText($conf, "faces = false`nplaces = false`nsmart_search = false`ntext_search = false`nscan_interval_minutes = 0`n")

          $p = Start-Process -FilePath 'dist\Snapshots.exe' -PassThru `
                 -ArgumentList @('--library', $lib, '--data', $data, '--config', $conf, '--port', '8799', '--no-browser') `
                 -RedirectStandardOutput smoke.out.log -RedirectStandardError smoke.err.log

          $base = 'http://127.0.0.1:8799'
          $web = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $hdr = @{ 'X-Snapshots-Request' = '1' }
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            Start-Sleep -Seconds 1
            try { Invoke-RestMethod "$base/api/health" | Out-Null; $up = $true } catch { }
          }
          $status = $null
          if ($up) {
            $body = @{ username = 'ci'; password = 'smoke test 123' } | ConvertTo-Json
            Invoke-RestMethod -Method Post "$base/api/auth/setup" -Body $body -ContentType 'application/json' `
              -Headers $hdr -WebSession $web | Out-Null
            for ($i = 0; $i -lt 60; $i++) {
              $s = Invoke-RestMethod "$base/api/status" -WebSession $web
              if ($s.photos -ge 2 -and -not $s.scan.running) { $status = $s; break }
              Start-Sleep -Seconds 1
            }
          }
          if ($status) {
            $login = Invoke-WebRequest "$base/login" -UseBasicParsing
            $page  = Invoke-WebRequest "$base/" -UseBasicParsing
            $js    = Invoke-WebRequest "$base/static/app.js" -UseBasicParsing
            $thumb = Invoke-WebRequest "$base/api/assets/1/thumb" -UseBasicParsing -WebSession $web
            $items = (Invoke-RestMethod "$base/api/assets" -WebSession $web).items
            $raw   = $items | Where-Object { $_.filename -eq 'camera.dng' }
            $rawThumb = if ($raw -and $raw.has_thumb) { (Invoke-WebRequest "$base/api/assets/$($raw.id)/thumb" -UseBasicParsing -WebSession $web).StatusCode } else { 0 }
            $map   = Invoke-WebRequest "$base/static/vendor/leaflet.js" -UseBasicParsing
            $anon  = try { Invoke-WebRequest "$base/api/status" -UseBasicParsing; 200 } catch { $_.Exception.Response.StatusCode.value__ }
            # 0.6: an edit (stored, the file untouched), a database backup, and an API key
            $hdr   = @{ 'X-Snapshots-Request' = '1' }
            $edit  = Invoke-RestMethod -Method Post "$base/api/assets/1/edits" -Body '{"edits": {"rotate": 90}}' `
                       -ContentType 'application/json' -Headers $hdr -WebSession $web
            $editThumb = (Invoke-WebRequest "$base/api/assets/1/thumb?v=$($edit.v)" -UseBasicParsing -WebSession $web).StatusCode
            $bk    = Invoke-RestMethod -Method Post "$base/api/backups" -Headers $hdr -WebSession $web
            $key   = Invoke-RestMethod -Method Post "$base/api/keys" -Body '{"name": "smoke test"}' `
                       -ContentType 'application/json' -Headers $hdr -WebSession $web
            $byKey = @((Invoke-RestMethod "$base/api/assets" -Headers @{ Authorization = "Bearer $($key.key)" }).items).Count
            $enc   = Invoke-RestMethod "$base/api/video-encoder" -WebSession $web
            # 0.7: a smart album, a zip export, a PDF photo book, and an offsite copy to a folder
            $smart = Invoke-RestMethod -Method Post "$base/api/albums" -Body '{"name": "Smart", "rule": {"kind": "photo"}}' `
                       -ContentType 'application/json' -Headers $hdr -WebSession $web
            $zipReq = Invoke-RestMethod -Method Post "$base/api/exports" -Body '{"ids": [1, 2], "format": "zip"}' `
                       -ContentType 'application/json' -Headers $hdr -WebSession $web
            $zipFile = Join-Path $env:RUNNER_TEMP 'smoke.zip'
            Invoke-WebRequest "$base$($zipReq.url)" -WebSession $web -OutFile $zipFile -UseBasicParsing
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zipRead = [IO.Compression.ZipFile]::OpenRead($zipFile)
            $zipCount = $zipRead.Entries.Count
            $zipRead.Dispose()
            $book = Invoke-RestMethod -Method Post "$base/api/exports" -Body '{"ids": [1, 2], "format": "pdf"}' `
                       -ContentType 'application/json' -Headers $hdr -WebSession $web
            for ($i = 0; $i -lt 60; $i++) {
              $task = Invoke-RestMethod "$base/api/tasks/$($book.id)" -WebSession $web
              if ($task.done) { break }
              Start-Sleep -Seconds 1
            }
            $bookFile = Join-Path $env:RUNNER_TEMP 'smoke.pdf'
            if ($task.done -and -not $task.error) {
              Invoke-WebRequest "$base/api/tasks/$($book.id)/file" -WebSession $web -OutFile $bookFile -UseBasicParsing
            }
            $copyTo = Join-Path $env:RUNNER_TEMP 'offsite-copy'
            $offBody = @{ method = 'folder'; target = $copyTo; hours = 24 } | ConvertTo-Json
            Invoke-RestMethod -Method Post "$base/api/offsite" -Body $offBody -ContentType 'application/json' `
              -Headers $hdr -WebSession $web | Out-Null
            Invoke-RestMethod -Method Post "$base/api/offsite/run" -Headers $hdr -WebSession $web | Out-Null
            for ($i = 0; $i -lt 60; $i++) {
              $off = (Invoke-RestMethod "$base/api/settings" -WebSession $web).offsite.state
              if ($off.last -and -not $off.running) { break }
              Start-Sleep -Seconds 1
            }
            # 0.9: stars, the library health check, the storage report, the year in review, the QR code script
            Invoke-RestMethod -Method Post "$base/api/marks" -Body '{"ids": [1], "rating": 4, "label": "green"}' `
              -ContentType 'application/json' -Headers $hdr -WebSession $web | Out-Null
            $starred = (Invoke-RestMethod "$base/api/assets?rating=4" -WebSession $web).items.Count
            Invoke-RestMethod -Method Post "$base/api/library-health/run" -Headers $hdr -WebSession $web | Out-Null
            for ($i = 0; $i -lt 60; $i++) {
              $hc = Invoke-RestMethod "$base/api/library-health" -WebSession $web
              if ($hc.last.finished_at -and -not $hc.running) { break }
              Start-Sleep -Seconds 1
            }
            $store = Invoke-RestMethod "$base/api/storage?fresh=true" -WebSession $web
            $years = (Invoke-RestMethod "$base/api/review" -WebSession $web).years
            $qr = Invoke-WebRequest "$base/static/vendor/qrcode.js" -WebSession $web -UseBasicParsing
            $boot = (Invoke-RestMethod "$base/api/settings" -WebSession $web).startup
            # 0.11: a Start menu shortcut can be made, found again and removed (PowerShell writes the .lnk).
            # Only reported, not failed on: a runner without a Start menu folder says so here.
            try {
              $lnkOn  = Invoke-RestMethod -Method Put "$base/api/settings/shortcuts" -Body '{"place": "start", "enabled": true}' `
                -ContentType 'application/json' -Headers $hdr -WebSession $web
              $lnkOff = Invoke-RestMethod -Method Put "$base/api/settings/shortcuts" -Body '{"place": "start", "enabled": false}' `
                -ContentType 'application/json' -Headers $hdr -WebSession $web
              if ($lnkOn.start.exists -and $lnkOn.start.current -and -not $lnkOff.start.exists) {
                Write-Host 'Start menu shortcut: made, recognised and removed.'
              } else {
                Write-Warning "Start menu shortcut did not round-trip: on=$($lnkOn | ConvertTo-Json -Compress) off=$($lnkOff | ConvertTo-Json -Compress)"
              }
            } catch { Write-Warning "Start menu shortcut failed: $($_.Exception.Message)" }
          }
          Get-Process -Name Snapshots -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host '--- exe output ---'
          Get-Content smoke.out.log, smoke.err.log, (Join-Path $data 'snapshots.log') -ErrorAction SilentlyContinue

          if (-not $up)                  { throw 'The exe did not start.' }
          if (-not $status)              { throw 'The exe did not index the test photo.' }
          if (-not $status.heif)         { throw 'HEIC support is missing from the exe.' }
          if ($login.StatusCode -ne 200 -or $page.Content -notmatch 'Snapshots') { throw 'The web pages are not served.' }
          if ($js.StatusCode    -ne 200) { throw 'Bundled web files are missing from the exe.' }
          if ($thumb.StatusCode -ne 200) { throw 'Thumbnails are not being made.' }
          if (-not $status.raw)          { throw 'RAW support (rawpy) is missing from the exe.' }
          if ($rawThumb -ne 200)         { throw "The RAW file was not read: $($raw | ConvertTo-Json -Compress)" }
          if ($raw.taken_at -ne '2024-06-01T12:00:00') { throw "The RAW file's date was not read: $($raw.taken_at)" }
          if ($map.StatusCode -ne 200)   { throw 'The map files are missing from the exe.' }
          if ($anon -ne 401)             { throw 'The library was visible without logging in.' }
          if (-not $edit.edited -or $editThumb -ne 200) { throw "Editing a photo did not work: $($edit | ConvertTo-Json -Compress)" }
          if (-not $bk.name)             { throw 'The database backup failed.' }
          if ($byKey -lt 2)              { throw 'An API key could not read the library.' }
          if ($smart.count -lt 2)        { throw "The smart album found nothing: $($smart | ConvertTo-Json -Compress)" }
          if ($zipCount -ne 2)           { throw "The zip export holds $zipCount files instead of 2." }
          if (-not $task.done -or $task.error -or $task.result.pages -lt 2) { throw "The photo book failed: $($task | ConvertTo-Json -Compress)" }
          if (-not (Test-Path $bookFile) -or (Get-Content $bookFile -TotalCount 1) -notmatch '^%PDF') { throw 'The photo book is not a PDF.' }
          if (-not (Test-Path (Join-Path $copyTo 'Library\a.jpg')) -or -not (Test-Path (Join-Path $copyTo 'Database\snapshots.db'))) {
            throw "The offsite copy was not made: $($off | ConvertTo-Json -Compress)"
          }
          if ($starred -ne 1)            { throw "Stars were not saved: $starred photos with 4 stars." }
          if (-not $hc.last.finished_at -or $hc.last.problems -ne 0 -or $hc.last.checked -lt 2) { throw "The library health check failed: $($hc | ConvertTo-Json -Compress -Depth 4)" }
          if ($store.kinds.photos.items -lt 1 -or -not $store.disks[0].available) { throw "The storage report failed: $($store | ConvertTo-Json -Compress -Depth 3)" }
          if (-not $years -or $years.Count -lt 1) { throw 'The year in review found no years.' }
          if (-not $boot.supported -or $boot.enabled) { throw 'Start with Windows should be available and off by default.' }
          if ($qr.StatusCode -ne 200)    { throw 'The QR code script for two-step login is missing from the exe.' }
          Write-Host "Video converting: ffmpeg $($enc.ffmpeg), encoder $($enc.using)"
          Write-Host "Smoke test passed: $($status.photos) photos indexed (one RAW), login required, HEIC and RAW support present, map files served, editing, backups, API keys, smart albums, exports, the photo book, the offsite copy, stars, the health check, the storage report and the year in review work."

      - name: Smoke test the app window
        shell: pwsh
        run: |
          # Start the exe the way a double-click does: no options, so it opens its own window.
          $lib  = Join-Path $env:RUNNER_TEMP 'win-lib'
          $data = Join-Path $env:RUNNER_TEMP 'win-data'
          $conf = Join-Path $env:RUNNER_TEMP 'win.toml'
          New-Item -ItemType Directory -Force $lib | Out-Null
          python -c "from PIL import Image; Image.new('RGB', (64, 64), (10, 120, 160)).save(r'$lib\a.jpg')"
          [IO.File]::WriteAllText($conf, "faces = false`nplaces = false`nsmart_search = false`ntext_search = false`nscan_interval_minutes = 0`n")

          # A program with no console window has "GUI" (2) as its subsystem, a console program has 3.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path 'dist\Snapshots.exe'))
          $subsystem = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 24 + 68)

          Start-Process -FilePath 'dist\Snapshots.exe' -ArgumentList @('--library', $lib, '--data', $data, '--config', $conf, '--port', '8798')
          $base = 'http://127.0.0.1:8798'
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            Start-Sleep -Seconds 1
            try { Invoke-RestMethod "$base/api/health" | Out-Null; $up = $true } catch { }
          }

          # The exe is two processes (a launcher and the program); the window belongs to one of them.
          $win = $null
          for ($i = 0; $i -lt 60 -and -not $win; $i++) {
            $win = Get-Process -Name Snapshots -ErrorAction SilentlyContinue |
                     Where-Object { $_.MainWindowTitle -eq 'Snapshots' } | Select-Object -First 1
            if (-not $win) { Start-Sleep -Seconds 1 }
          }

          $closed = $false
          if ($win) {
            Start-Sleep -Seconds 3                      # let the page load
            [void]$win.CloseMainWindow()                # the person closes the window...
            for ($i = 0; $i -lt 45 -and -not $closed; $i++) {
              Start-Sleep -Seconds 1
              $closed = -not (Get-Process -Name Snapshots -ErrorAction SilentlyContinue)
            }
          }
          $stillServing = $false
          try { Invoke-RestMethod "$base/api/health" -TimeoutSec 3 | Out-Null; $stillServing = $true } catch { }
          $storage = Test-Path (Join-Path $data 'webview')

          Get-Process -Name Snapshots -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host '--- exe log ---'
          Get-Content (Join-Path $data 'snapshots.log') -ErrorAction SilentlyContinue

          if ($subsystem -ne 2)  { throw "Snapshots.exe still opens a console window (subsystem $subsystem)." }
          if (-not $up)          { throw 'The exe did not start.' }
          if (-not $win)         { throw 'The app window did not appear.' }
          if (-not $closed)      { throw 'Closing the window did not stop Snapshots.' }
          if ($stillServing)     { throw 'The server was still running after the window was closed.' }
          if (-not $storage)     { throw 'The window did not create its storage folder (the login would not be remembered).' }
          Write-Host 'Window smoke test passed: own window, no console, closing it stops Snapshots.'

      - name: Smoke test search by content and text reading
        shell: pwsh
        run: |
          # The exe downloads the two models (about 165 MB), reads the words in a photo, and learns what is in it.
          $lib  = Join-Path $env:RUNNER_TEMP 'ai-lib'
          $data = Join-Path $env:RUNNER_TEMP 'ai-data'
          $conf = Join-Path $env:RUNNER_TEMP 'ai.toml'
          New-Item -ItemType Directory -Force $lib | Out-Null
          python -c "from PIL import Image, ImageDraw, ImageFont; im = Image.new('RGB', (1200, 600), (40, 110, 60)); d = ImageDraw.Draw(im); d.rectangle((80, 220, 1120, 360), fill=(250, 250, 240)); d.text((110, 240), 'WELCOME TO SEDONA', font=ImageFont.truetype(r'C:\Windows\Fonts\arialbd.ttf', 90), fill=(10, 10, 10)); im.save(r'$lib\sign.jpg')"
          [IO.File]::WriteAllText($conf, "faces = false`nplaces = false`nscan_interval_minutes = 0`n")

          $p = Start-Process -FilePath 'dist\Snapshots.exe' -PassThru `
                 -ArgumentList @('--library', $lib, '--data', $data, '--config', $conf, '--port', '8797', '--no-browser')
          $base = 'http://127.0.0.1:8797'
          $web = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $hdr = @{ 'X-Snapshots-Request' = '1' }
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            Start-Sleep -Seconds 1
            try { Invoke-RestMethod "$base/api/health" | Out-Null; $up = $true } catch { }
          }
          $done = $null
          if ($up) {
            $body = @{ username = 'ci'; password = 'smoke test 123' } | ConvertTo-Json
            Invoke-RestMethod -Method Post "$base/api/auth/setup" -Body $body -ContentType 'application/json' `
              -Headers $hdr -WebSession $web | Out-Null
            for ($i = 0; $i -lt 300; $i++) {
              $s = Invoke-RestMethod "$base/api/status" -WebSession $web
              $vectors = $s.photos -ge 1 -and -not $s.scan.running -and $s.content.pending -eq 0 -and $s.text.pending -eq 0 `
                         -and -not $s.content.running -and -not $s.text.running
              if ($vectors) { $done = $s; break }
              Start-Sleep -Seconds 2
            }
          }
          if ($done) {
            $photo  = Invoke-RestMethod "$base/api/assets/1" -WebSession $web
            $found  = Invoke-RestMethod "$base/api/search?q=sedona" -WebSession $web
            $look   = Invoke-RestMethod "$base/api/search?q=a%20green%20sign" -WebSession $web
            $clean  = Invoke-RestMethod "$base/api/cleanup" -WebSession $web
          }
          Get-Process -Name Snapshots -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host '--- exe log ---'
          Get-Content (Join-Path $data 'snapshots.log') -ErrorAction SilentlyContinue | Select-Object -Last 40

          if (-not $up)                     { throw 'The exe did not start.' }
          if (-not $done)                   { throw "Search by content or text reading did not finish: $($s | ConvertTo-Json -Depth 4)" }
          if ($done.content.message)        { throw "Search by content failed: $($done.content.message)" }
          if ($done.text.message)           { throw "Text reading failed: $($done.text.message)" }
          if ($photo.text -notmatch 'SEDONA') { throw "The words in the photo were not read (got '$($photo.text)')." }
          if ($found.words -ne 1)           { throw 'Searching for a word in the photo did not find it.' }
          if (-not $look.content_ready -or $look.content -lt 1) { throw 'Search by content found nothing.' }
          if (-not $clean.enabled)          { throw 'The photo checks are not running.' }
          Write-Host "Search smoke test passed: read '$($photo.text)', content search ready."

      - name: Build the installer
        shell: pwsh
        run: |
          # Inno Setup comes with GitHub's Windows machines; install it if this one doesn't have it.
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe') |
                      Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          $version = python -c "import snapshots; print(snapshots.__version__)"
          & $iscc "/DAppVersion=$version" installer\snapshots.iss
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist\Snapshots-Setup.exe)) { throw 'The installer was not built.' }

      - name: Smoke test the installer
        shell: pwsh
        run: |
          # Install it quietly for this user, check what it made, then uninstall it and check nothing is left.
          $dir = Join-Path $env:RUNNER_TEMP 'installed-snapshots'
          $start = Join-Path ([Environment]::GetFolderPath('Programs')) 'Snapshots.lnk'
          $desk  = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Snapshots.lnk'

          $run = Start-Process -FilePath 'dist\Snapshots-Setup.exe' -Wait -PassThru `
                   -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", '/TASKS=desktopicon', "/LOG=$env:RUNNER_TEMP\setup.log")
          $installed = Test-Path (Join-Path $dir 'Snapshots.exe')
          $unins     = Get-ChildItem $dir -Filter 'unins*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $shell     = New-Object -ComObject WScript.Shell
          $target    = if (Test-Path $start) { $shell.CreateShortcut($start).TargetPath } else { '' }
          $hasDesk   = Test-Path $desk
          $listed    = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                         Where-Object { $_.DisplayName -eq 'Snapshots' }

          # The installed copy starts and serves (the same check as the plain exe).
          $up = $false
          if ($installed) {
            $lib = Join-Path $env:RUNNER_TEMP 'inst-lib'; $data = Join-Path $env:RUNNER_TEMP 'inst-data'
            New-Item -ItemType Directory -Force $lib | Out-Null
            [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'inst.toml'), "faces = false`nplaces = false`nsmart_search = false`ntext_search = false`nscan_interval_minutes = 0`n")
            Start-Process -FilePath (Join-Path $dir 'Snapshots.exe') -ArgumentList @('--library', $lib, '--data', $data, '--config', (Join-Path $env:RUNNER_TEMP 'inst.toml'), '--port', '8796', '--no-browser')
            for ($i = 0; $i -lt 60 -and -not $up; $i++) {
              Start-Sleep -Seconds 1
              try { Invoke-RestMethod 'http://127.0.0.1:8796/api/health' | Out-Null; $up = $true } catch { }
            }
          }

          # Uninstall while it is running (the uninstaller stops it).
          $gone = $false
          if ($unins) {
            Start-Process -FilePath $unins.FullName -Wait -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            Start-Sleep -Seconds 3
            $gone = -not (Test-Path (Join-Path $dir 'Snapshots.exe')) -and -not (Test-Path $start) -and -not (Test-Path $desk)
          }
          Get-Process -Name Snapshots -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host '--- setup log ---'
          Get-Content "$env:RUNNER_TEMP\setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 25

          if ($run.ExitCode -ne 0)       { throw "The installer exited with code $($run.ExitCode)." }
          if (-not $installed)           { throw 'The installer did not put Snapshots.exe in place.' }
          if (-not $unins)               { throw 'The installer made no uninstaller.' }
          if ($target -ne (Join-Path $dir 'Snapshots.exe')) { throw "The Start menu icon points at '$target'." }
          if (-not $hasDesk)             { throw 'The desktop icon was asked for but not made.' }
          if (-not $listed)              { throw 'Snapshots is not listed in Windows installed apps.' }
          if (-not $up)                  { throw 'The installed Snapshots.exe did not start.' }
          if (-not $gone)                { throw 'Uninstalling left Snapshots.exe or its icons behind.' }
          Write-Host 'Installer smoke test passed: installed for this user, icons made, listed in apps, starts, uninstalls cleanly.'

      - uses: actions/upload-artifact@v4
        with:
          name: Snapshots-windows
          path: |
            dist/Snapshots.exe
            dist/Snapshots-Setup.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Snapshots-Setup.exe
            dist/Snapshots.exe
