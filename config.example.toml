# Copy this file to config.toml and edit it. Every setting is optional except library_path
# (which can also be given on the command line with --library, or picked on first run).
#
# Use single quotes around Windows paths so backslashes are taken literally.

# The folder that holds your photos and videos. Snapshots only reads it, except that uploads are
# saved into an "Uploads" folder inside it, and emptying the trash deletes those files.
library_path = 'D:\Photos'

# Where the database, thumbnails and downloaded models are kept. Default: %LOCALAPPDATA%\Snapshots
# data_dir = 'D:\SnapshotsData'

# Address and port to listen on. 127.0.0.1 means "this computer only" (use Tailscale to reach it
# from other devices). Everyone has to log in either way.
host = "127.0.0.1"
port = 8080

# Scan the library for new, changed, moved and removed files when Snapshots starts...
index_on_start = true
# ...and again every this many minutes. 0 turns automatic rescans off.
scan_interval_minutes = 15

# Find faces and group them into people (downloads two small models, about 39 MB, once).
faces = true
# How many CPU threads face recognition may use. Lower it if the computer feels busy.
face_threads = 2
# How alike two faces must be to count as the same person. Higher = stricter (more, smaller groups).
# face_match_threshold = 0.50
# Unnamed groups with fewer faces than this are not shown on the People page.
# min_faces_per_person = 3

# Turn GPS positions into town names (downloads the GeoNames town list, about 14 MB, once).
# Lookups happen on this computer; your locations are never sent anywhere.
places = true
# Two groups of faces that are this alike on average are put together automatically, if neither is
# hidden and they don't have two different names. 0 turns this off.
# face_merge_threshold = 0.42

# Look for copies, bursts, blurry and dark photos (Clean up page). Needs no downloads.
photo_checks = true
# Copies differ in at most this many of 64 fingerprint bits. Higher finds more edited copies.
# duplicate_distance = 8
# Edited, cropped and filtered copies, found by what they show (needs smart_search): how alike, 0 to 1.
# 0 turns it off.
# lookalike_similarity = 0.96
# Photos taken within burst_seconds of each other that differ in at most burst_distance bits are a burst.
# burst_seconds = 30
# burst_distance = 14
# Lower these to flag fewer photos as blurry or too dark.
# blur_threshold = 50
# dark_threshold = 30

# Events: a pause of this many hours starts a new event; events with fewer photos are not listed.
# event_gap_hours = 4
# event_min_items = 8

# Search by what is in a photo, like "dog on the beach" (downloads a 154 MB model once).
smart_search = true
# Read text in photos (signs, screenshots, receipts) so it can be searched (downloads 11 MB once).
text_search = true
# How many CPU threads these two may use.
search_threads = 2

# Leave screenshots, documents and receipts out of All and Photos (they stay in Clean up and search).
# hide_clutter = false
# Date files that have no date inside from their GPS time or the numbered photos beside them.
# guess_dates = true

# Where the map's pictures come from. OpenStreetMap is used by default, which means your computer asks
# OpenStreetMap's servers for the areas of the map you look at (not for your photos' locations).
# "" shows only the country outlines that come with Snapshots and fetches nothing.
# map_tiles = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
# map_attribution = "© OpenStreetMap contributors"

# More folders of photos, besides library_path (another drive, say). They are only read.
# They can also be added and removed in the app: your name, Settings (administrators).
# extra_libraries = ['E:\Phone backup', 'F:\Scans']

# A copy of the database (albums, tags, people's names, accounts, edits, comments; not your photos)
# is made every backup_hours, and the newest backup_keep are kept. 0 turns backups off.
# backup_hours = 24
# backup_keep = 14
# backup_dir = 'E:\Snapshots backups'

# Videos the app can't play (HEVC from phones, AVI, MKV) are converted once when opened, with ffmpeg.
# "auto" uses the graphics card if ffmpeg can (NVIDIA, AMD or Intel), otherwise the processor.
# Or choose one: "libx264" (processor), "h264_amf" (AMD), "h264_nvenc" (NVIDIA), "h264_qsv" (Intel).
# video_encoder = "auto"
# Converted copies are kept in the data folder, at most this many GB.
# video_cache_gb = 20

# A copy of the photos themselves (the backups above hold only the database). Also set in the app:
# your name, Settings. "folder" copies new and changed files to another folder (another drive, a NAS,
# a folder OneDrive keeps in the cloud); "rclone" copies to an rclone remote; "restic" makes encrypted,
# versioned snapshots in a restic repository. Files deleted from the library stay in the copy.
# offsite_method = "folder"
# offsite_target = 'E:\Photo copy'          # or "b2-crypt:photos" (rclone), or 'E:\restic-repo' (restic)
# offsite_hours = 24
# offsite_password_file = 'C:\Users\me\restic-password.txt'   # restic only

# Ask "Same person?" about groups of faces at least this alike (0 turns the questions off).
# face_suggest_threshold = 0.30

# Write descriptions, tags, people, stars, labels and changed dates and places into .xmp files
# beside the photos, for Lightroom, digiKam, darktable and Immich. Also set in the app: Settings.
# xmp_sidecars = false

# Where uploads are filed, by the date taken. You can use {year} {month} {monthname} {day} {date}
# {camera} {type} (Photos or Videos) and {user} (who uploaded it).
# upload_template = "Uploads/{year}/{month}"

# Check every file for damage this often, in days (0: only when you ask, in Clean up, Library health).
# health_check_days = 0

# Year in review videos: how many seconds each photo is shown.
# review_seconds = 4
